# yaml-language-server: $schema=./schema.json
# Level 1 DRAFT: observed whole-product dependency and data mapping. Not an acceptance claim.
# Observed from source at Modelable 1.15.2 (branch fix/conversation-preview-operational-errors);
# see compilation-map.md, registry-protocol-map.md, browser-persistence-map.md, whole-product-level1.md.
# The bounded compilation slice stays in compilation.yaml and is not duplicated here.
system:
  id: modelable-product
  version: "1.15.2"
  status: specified
  external_sources:
    - user-mdl-workspaces
    - modelable-config-and-facet-sidecars
    - local-registry-snapshots-and-locks
    - optional-oci-registries
    - optional-apicurio-json-schema-registry
    - optional-marquez-lineage-endpoint
    - optional-dbt-fhir-odcs-specifications
    - optional-llm-provider-endpoints
    - browser-local-workspace-storage
capabilities:
  - id: local-contract-toolchain
    version: "1.0"
    status: specified
    preconditions: [readable .mdl workspace supplied]
    postconditions: [diagnostics, generated artifacts, plans and local registry state produced through the existing staging and promotion boundary]
    invariants: [registry IDs and enum numbers are never reassigned or reused, OCI publication is unsupported and fails explicitly]
    failure_modes: [CompilationError, CompilationDiagnosticsError, FileTransactionError, FileTransactionCommittedError, LockContentionError, RegistryIdLockContentionError, OCIRegistryError]
    interface:
      operation: "Python API: modelable.operations.compilation.CompilationService plus compiler, parser, validation, planner, emitters and registry modules"
      idempotent: false
      auth: caller filesystem permissions; explicit local invocation
      errors: {CompilationError: python-exception, CompilationDiagnosticsError: python-exception, FileTransactionError: python-exception, FileTransactionCommittedError: committed-with-cleanup-error, LockContentionError: python-exception, RegistryIdLockContentionError: python-exception, OCIRegistryError: python-exception}
  - id: native-command-workflows
    version: "1.0"
    status: specified
    preconditions: [command invoked with local filesystem access]
    postconditions: [command effects limited to the toolchain and optional configured integrations]
    invariants: [known operational failures render as CLI errors with nonzero status]
    failure_modes: [click-error]
  - id: desktop-language-and-conversation
    version: "1.0"
    status: specified
    preconditions: [stdio language-server session with workspace URI]
    postconditions: [diagnostics and conversation previews returned; applying a preview requires explicit confirmation]
    invariants: [conversation preview does not change workspace files, a failed preview keeps any pending action]
    failure_modes: [error-reply]
    interface:
      operation: "stdio JSON-RPC language server started by 'modelable lsp', including the conversation protocol (protocolVersion 2 in tests)"
      idempotent: false
      auth: local stdio session; apply requires an exact confirmation binding
      errors: {error-reply: "ConversationReply kind=error"}
  - id: browser-compiler-api
    version: "1.0"
    status: specified
    preconditions: [browser DTO request from the playground worker]
    postconditions: [same Python semantics returned through browser DTOs]
    invariants: [browser wheel targets Python 3.14 only]
    failure_modes: [browser-error-dto]
    interface:
      operation: "modelable.browser.api.BrowserCompiler via browser dispatch in the Pyodide worker"
      idempotent: false
      auth: same-origin worker; no remote authentication
      errors: {browser-error-dto: "browser error DTO"}
  - id: playground-workspace
    version: "1.0"
    status: specified
    preconditions: [browser with a Pyodide worker]
    postconditions: [workspace source persisted to IndexedDB when available, otherwise held in memory]
    invariants: [a stored record with a greater revision is not overwritten by the repository, derived results are memory-only]
    failure_modes: [memory-only, recovery-required]
  - id: vscode-model-authoring
    version: "1.0"
    status: specified
    preconditions: [configured Python interpreter able to start the language server]
    postconditions: [editor connected to the stdio language server]
    invariants: [conversation apply crosses an explicit preview and confirm boundary]
    failure_modes: [server-start-failure]
components:
  - id: semantic-toolchain
    version: "1.15.2"
    status: specified
    provides: [local-contract-toolchain]
    owns_data: [registry-id-ledger, enum-number-ledger, registry-index-db, registry-snapshot, usage-manifest]
    # Coarse inventory-level boundary: spans compiler, parser, validation, planner, emitters, registry and operations.
    # Override preserves the existing shared local-state boundary; splitting needs discovery (MOD-ADOPT-04).
    context_budget: {max_owns_data: 5}
    source_paths:
      - cli/src/modelable/compiler
      - cli/src/modelable/parser
      - cli/src/modelable/validation
      - cli/src/modelable/planner
      - cli/src/modelable/emitters
      - cli/src/modelable/registry
      - cli/src/modelable/operations
  - id: native-cli
    version: "1.15.2"
    status: specified
    provides: [native-command-workflows]
    requires: [local-contract-toolchain]
    source_paths: [cli/src/modelable/cli.py, cli/src/modelable/commands, cli/src/modelable/llm, cli/src/modelable/specs]
  - id: desktop-language-server
    version: "1.15.2"
    status: specified
    provides: [desktop-language-and-conversation]
    requires: [local-contract-toolchain]
    source_paths: [cli/src/modelable/lsp, cli/src/modelable/language]
  - id: browser-facade
    version: "1.15.2"
    status: specified
    provides: [browser-compiler-api]
    requires: [local-contract-toolchain]
    source_paths: [cli/src/modelable/browser, cli/browser]
  - id: browser-playground
    version: "1.15.2"
    status: specified
    provides: [playground-workspace]
    requires: [browser-compiler-api]
    owns_data: [workspace-record, theme-preference]
    source_paths: [web/src, web/package.json]
  - id: vscode-extension
    version: "1.15.2"
    status: specified
    provides: [vscode-model-authoring]
    requires: [desktop-language-and-conversation]
    source_paths: [vscode/extension.js, vscode/package.json]
data_models:
  - id: registry-id-ledger
    version: "1.0"
    owner: semantic-toolchain
    classification: restricted
    classification_review: MOD-ADOPT-03
    fields:
      entries: "dict[str, int] mapping 'domain.Name' to a never-reused small integer"
  - id: enum-number-ledger
    version: "1.0"
    owner: semantic-toolchain
    classification: restricted
    classification_review: MOD-ADOPT-03
    fields:
      members: "list of {name, number} per qualified declaration"
      reservations: "list of {name, number}; numbers and names of removed members, never reused"
  - id: registry-index-db
    version: "1.0"
    owner: semantic-toolchain
    classification: restricted
    classification_review: MOD-ADOPT-03
    schema_path: cli/src/modelable/registry/schema.sql
    derived_from: [registry-id-ledger]
    fields:
      tables: "15 SQLite tables defined in schema.sql, rebuilt from the validated workspace on each build"
  - id: registry-snapshot
    version: "1.0"
    owner: semantic-toolchain
    classification: restricted
    classification_review: MOD-ADOPT-03
    fields:
      lock_file: registry.lock under the snapshot root
      objects_dir: registry/objects under the snapshot root
  - id: usage-manifest
    version: "1.0"
    owner: semantic-toolchain
    classification: restricted
    classification_review: MOD-ADOPT-03
    fields:
      protocol: "modelable.usage/v0 JSON manifest; remaining fields not yet mapped"
  - id: workspace-record
    version: "1.0"
    owner: browser-playground
    classification: restricted
    classification_review: MOD-ADOPT-03
    external_source: browser-local-workspace-storage
    fields:
      schemaVersion: "1"
      id: str
      revision: int
      files: "list of {path: str, content: str, version: int}"
      activeFile: str
      metadata: "optional {lastAiAccept: {provider, model, timestamp}}"
  - id: theme-preference
    version: "1.0"
    owner: browser-playground
    classification: internal
    classification_review: MOD-ADOPT-03
    external_source: browser-local-workspace-storage
    fields:
      modelable_theme: "'light' or 'dark'; absence means system"
requirements:
  - id: MOD-ADOPT-01
    version: "1.0"
    status: specified
    target: modelable-product
    category: functional
    criteria:
      - Complete ownership and dependency discovery before accepting whole-product architecture.
      - Map native integrations, registry side effects, browser storage and all public protocol schemas.
      - Preserve docs/architecture.md and modelable capabilities as existing product authorities.
  - id: MOD-ADOPT-02
    version: "1.0"
    status: specified
    target: modelable-product
    category: functional
    criteria:
      - Expand characterization beyond compilation before accepting whole-product behavioral conformance.
      - Review every verification category and applicable formal models with current evidence before release.
  - id: MOD-ADOPT-03
    version: "1.0"
    status: specified
    target: modelable-product
    kind: non-functional
    category: security
    criteria:
      - Replace each provisional classification on whole-product data models with a maintainer-reviewed classification.
      - Classification labels in this draft are conservative handling policy, not observed product classifications.
  - id: MOD-ADOPT-04
    version: "1.0"
    status: specified
    target: modelable-product
    category: functional
    criteria:
      - Discover finer consistency boundaries inside semantic-toolchain before removing its context-budget override.
      - Map snapshot, usage, resolver, Apicurio, OpenLineage and Git source protocols, Pyodide worker state and AI provider state.
risks:
  - {id: incomplete-architecture-discovery, target: modelable-product, treatment: mitigation, mitigated_by: [MOD-ADOPT-01]}
  - {id: incomplete-product-characterization, target: modelable-product, treatment: mitigation, mitigated_by: [MOD-ADOPT-02]}
  - {id: provisional-data-classification, target: modelable-product, treatment: mitigation, mitigated_by: [MOD-ADOPT-03]}
  - {id: coarse-toolchain-boundary, target: modelable-product, treatment: mitigation, mitigated_by: [MOD-ADOPT-04], waives: context-budget, expires: release}
evidence: []
