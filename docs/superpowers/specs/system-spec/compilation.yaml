# yaml-language-server: $schema=./schema.json
# Bounded as-is compilation slice, not a whole-product or release specification.
system: {id: modelable-compilation-slice, version: "1.0", status: specified}
capabilities:
  - id: direct-compilation
    version: "1.0"
    status: specified
    preconditions: [readable workspace and supported target supplied]
    postconditions: [generated artifacts and associated local state promoted from staging on success]
    invariants: [failed preflight does not publish destination state, direct path does not write conversational audit]
    failure_modes: [CompilationError, CompilationDiagnosticsError, FileTransactionError, FileTransactionCommittedError]
    interface:
      operation: CompilationService.execute_direct
      idempotent: false
      auth: caller filesystem permissions; explicit local invocation
      request: compilation-request
      response: direct-compilation-result
      errors: {CompilationError: python-exception, CompilationDiagnosticsError: python-exception, FileTransactionError: python-exception, FileTransactionCommittedError: committed-with-cleanup-error}
  - id: preview-compilation
    version: "1.0"
    status: specified
    preconditions: [conversation policy supplied and workspace-restricted request]
    postconditions: [pending compilation contains staged file previews and source fingerprints]
    invariants: [preview does not change destination workspace files, staging is outside workspace]
    failure_modes: [CompilationError, CompilationDiagnosticsError]
    interface:
      operation: CompilationService.preview
      idempotent: false
      auth: caller filesystem permissions; conversation policy
      request: compilation-request
      response: pending-compilation
      errors: {CompilationError: python-exception, CompilationDiagnosticsError: python-exception}
  - id: apply-compilation
    version: "1.0"
    status: specified
    preconditions: [pending compilation and exact matching confirmation supplied]
    postconditions: [exact staged files and private audit promoted on success]
    invariants: [freshness checked under locks, staged bytes promoted without recompiling]
    failure_modes: [CompilationError, StaleCompilationError, FileTransactionError, FileTransactionCommittedError]
    interface:
      operation: CompilationService.apply
      idempotent: false
      auth: confirmation binding and caller filesystem permissions
      request: [pending-compilation, compilation-confirmation]
      response: applied-compilation
      errors: {CompilationError: python-exception, StaleCompilationError: python-exception, FileTransactionError: python-exception, FileTransactionCommittedError: committed-with-cleanup-error}
  - id: discard-compilation
    version: "1.0"
    status: specified
    preconditions: [pending compilation supplied]
    postconditions: [invocation staging removed or cleanup failure surfaced]
    invariants: [discard does not apply staged artifacts]
    failure_modes: [CompilationError]
    interface:
      operation: CompilationService.discard
      idempotent: true
      auth: caller filesystem permissions
      request: pending-compilation
      errors: {CompilationError: python-exception}
components:
  - id: compilation-unit
    version: "1.15.2"
    status: specified
    provides: [direct-compilation, preview-compilation, apply-compilation, discard-compilation]
    owns_data: [compilation-request, pending-compilation, compilation-confirmation, applied-compilation, direct-compilation-result]
    context_budget: {max_owns_data: 5}
    source_paths:
      - cli/src/modelable/operations/compilation.py
      - cli/src/modelable/operations/file_transaction.py
      - cli/src/modelable/operations/compilation_audit.py
data_models:
  - id: compilation-request
    version: "1.0"
    owner: compilation-unit
    classification: restricted
    fields:
      source: Path
      target: str
      out_dir: Path | None
      registry_path: str
      snapshot_path: Path | None
      registry_ids_path: Path
      allow_orphaned_registry_ids: bool
      enum_numbers_path: Path
      domains: tuple[str, ...]
      descriptor_set: bool
      package: str | None
      overlay_path: Path | None
      usage_manifest: bool
  - id: pending-compilation
    version: "1.0"
    owner: compilation-unit
    classification: restricted
    fields:
      action_id: str
      request: CompilationRequest
      workspace_root: Path
      staging_dir: Path
      files: tuple[CompilationFilePreview, ...]
      source_fingerprints: tuple[FileFingerprint, ...]
      affected_definitions: tuple[AffectedDefinition, ...]
      registry_id_changes: tuple[RegistryIdChange, ...]
      registry_ids_before: dict[str, int]
      warnings: tuple[str, ...]
      manifest_fingerprint: str
      preview_timestamp: str
      audit_resolved_parent: Path
  - id: compilation-confirmation
    version: "1.0"
    owner: compilation-unit
    classification: restricted
    fields:
      session_id: str
      action_id: str
      manifest_fingerprint: str
      surface: Literal[cli-chat, vscode-chat]
      provider: str | None
      model: str | None
  - id: applied-compilation
    version: "1.0"
    owner: compilation-unit
    classification: restricted
    fields:
      action_id: str
      written_paths: tuple[Path, ...]
      affected_definitions: tuple[AffectedDefinition, ...]
      files: tuple[CompilationFilePreview, ...]
      audit_path: Path
  - id: direct-compilation-result
    version: "1.0"
    owner: compilation-unit
    classification: restricted
    fields: {written_paths: "tuple[Path, ...]", events: "tuple[CompilationEvent, ...]"}
requirements:
  - id: MOD-COMP-01
    version: "1.0"
    status: specified
    target: direct-compilation
    category: functional
    criteria: [Direct compilation writes registry/plans/artifacts for supported targets and no conversational audit.]
  - id: MOD-COMP-02
    version: "1.0"
    status: specified
    target: preview-compilation
    category: contract
    criteria: [Preview stages file changes without mutating workspace destinations.]
  - id: MOD-COMP-03
    version: "1.0"
    status: specified
    target: apply-compilation
    category: semantic
    criteria: [Apply rejects stale inputs and tampering and promotes the confirmed staged bytes without recompilation.]
  - id: MOD-COMP-04
    version: "1.0"
    status: specified
    target: apply-compilation
    category: concurrency
    criteria: [Waiting apply rechecks freshness under the workspace lock.]
  - id: MOD-COMP-05
    version: "1.0"
    status: specified
    target: apply-compilation
    kind: non-functional
    category: resilience
    criteria: [Injected audit promotion failure rolls back destination files; committed cleanup failures remain distinguishable from uncommitted failures.]
  - id: MOD-COMP-06
    version: "1.0"
    status: specified
    target: preview-compilation
    kind: non-functional
    category: security
    criteria: [Preview rejects prohibited and overlapping control/output paths before publication; full symlink coverage is separately tracked.]
  - id: MOD-COMP-07
    version: "1.0"
    status: specified
    target: discard-compilation
    kind: non-functional
    category: resilience
    criteria: [Discard is idempotent and surfaces incomplete cleanup.]
  - id: MOD-COMP-08
    version: "1.0"
    status: specified
    target: apply-compilation
    category: serialization
    criteria: [Successful apply writes audit schemaVersion 1 with the pending manifest fingerprint and without prompt contents.]
  - id: MOD-COMP-09
    version: "1.0"
    status: specified
    target: modelable-compilation-slice
    category: functional
    criteria:
      - Before release, establish measured performance/scalability/observability requirements and evidence for this slice.
      - Complete transitive type/ownership mapping, production failure review and formal applicability assessment.
  - id: MOD-COMP-10
    version: "1.0"
    status: verified
    target: preview-compilation
    kind: non-functional
    category: security
    criteria: [Run the changed-parent and escaping-symlink characterization cases on a host supporting directory symlinks.]
risks:
  - id: compilation-category-gap
    target: modelable-compilation-slice
    treatment: mitigation
    mitigated_by: [MOD-COMP-09]
    waives: verification-category
    expires: verification
  - id: compilation-failure-review-gap
    target: modelable-compilation-slice
    treatment: mitigation
    mitigated_by: [MOD-COMP-09]
