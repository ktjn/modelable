name: Tag release

# Pushes the annotated version tag for a merged release PR created by
# `.github/workflows/release-prep.yml`. Pushing `v<version>` triggers
# `.github/workflows/release.yml`, which re-verifies the artifacts and
# publishes to PyPI / the marketplace.
#
# Fires only when a PR titled `Release X.Y.Z` is merged (closed with
# `merged == true`), so unrelated merges on main are never tagged.
#
# The tag push below must NOT use the default GITHUB_TOKEN: GitHub does not
# let events triggered by the default token (including a tag push) start
# other workflow runs, as an anti-recursion safeguard. With GITHUB_TOKEN this
# job succeeds and the tag appears in the repo, but release.yml's
# `push: tags: v*` trigger silently never fires and nothing gets published.
# RELEASE_TAG_TOKEN must be a PAT (fine-grained, `contents: write` on this
# repo only) or GitHub App installation token added as a repository secret;
# see docs/maintainers.md section 8 for setup.
#
# checkout must run with persist-credentials: false: otherwise actions/checkout
# leaves a GITHUB_TOKEN credential in http.https://github.com/.extraheader for
# the whole github.com host, which git sends even when the push URL below
# embeds the PAT — so the push silently authenticates as GITHUB_TOKEN again
# and the anti-recursion safeguard swallows it (tag appears, release.yml never
# fires), defeating the very fix this comment block describes above.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  tag:
    name: Tag release
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Derive version from pull request title
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TITLE="${{ github.event.pull_request.title }}"
          if ! VERSION=$(echo "$TITLE" | sed -n 's/^Release \([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p'); then
            :
          fi
          if [ -z "${VERSION:-}" ]; then
            echo "title '$TITLE' is not a 'Release X.Y.Z' PR; skipping"
            exit 0
          fi
          if git tag --list "v${VERSION}" | grep -q .; then
            echo "tag v${VERSION} already exists; skipping"
            exit 0
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Require RELEASE_TAG_TOKEN
        if: steps.version.outputs.version != ''
        shell: bash
        env:
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG_TOKEN}" ]; then
            echo "::error::RELEASE_TAG_TOKEN repository secret is not set." >&2
            echo "A tag pushed with the default GITHUB_TOKEN cannot trigger release.yml" >&2
            echo "(GitHub blocks workflow runs cascading from the default token, to" >&2
            echo "prevent recursive runs). Add a PAT or GitHub App installation token" >&2
            echo "with 'contents: write' on this repo as the RELEASE_TAG_TOKEN secret" >&2
            echo "before merging another Release PR. See docs/maintainers.md section 8." >&2
            exit 1
          fi

      - name: Push annotated version tag
        if: steps.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release ${VERSION}"
          git push "https://x-access-token:${RELEASE_TAG_TOKEN}@github.com/${{ github.repository }}.git" "v${VERSION}"
