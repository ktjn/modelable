syntax = "proto3";

package modelable.customer.v1;

import "google/protobuf/timestamp.proto";

message CustomerEvent {
  string customer_id = 1;
  string display_name = 2;
  string email = 3;
  string internal_risk_notes = 4;
  CustomerEventStatus status = 5;
  repeated string tags = 6;
  map<string, int64> metadata = 7;
  bytes address = 8;
  bytes favorite_product = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

enum CustomerEventStatus {
  CUSTOMER_EVENT_STATUS_UNSPECIFIED = 0;
  CUSTOMER_EVENT_STATUS_ACTIVE = 1;
  CUSTOMER_EVENT_STATUS_SUSPENDED = 2;
  CUSTOMER_EVENT_STATUS_DELETED = 3;
}
