# yaml-language-server: $schema=../../../reference-implementation/fragment.schema.json
# Fragment owned by the checkout component; merged into ../spec.yaml by `include`.

capabilities:
  - id: place-order
    version: "1.0"
    status: verified
    preconditions: [cart_not_empty, customer_active]
    postconditions: [order_created, inventory_reserved]
    invariants: [order_paid_at_most_once]
    failure_modes: [insufficient_inventory, customer_blocked]
    interface: { operation: POST /v1/orders, request: order, response: order, idempotent: true, auth: customer-token, errors: { insufficient_inventory: 409, customer_blocked: 403 } }

components:
  - id: checkout
    version: "1.0"
    status: verified
    layer: application
    provides: [place-order]
    requires: [reserve-inventory@^1.0]
    owns_data: [order]
    source_paths: [src/checkout]
    test_paths: [tests/checkout]
    fakes: { reserve-inventory: tests/checkout/fakes/reserve_inventory.py }

data_models:
  - id: order
    version: "1.0"
    owner: checkout
    classification: confidential
    fields: { order_id: uuid, customer_email: string, status: string }

requirements:
  - { id: req-order, version: "1.0", status: verified, category: functional, target: place-order, criteria: [order created when stock available] }
  - { id: req-order-contract, version: "1.0", status: verified, category: contract, target: place-order, criteria: [returns 201 on creation and 409 on insufficient_inventory] }
  - { id: req-order-serial, version: "1.0", status: verified, category: serialization, target: order, criteria: [order payload validates against schema] }
  - { id: req-resilience, version: "1.0", status: verified, category: resilience, target: checkout, kind: non-functional, criteria: [retries transient inventory timeouts with idempotency key] }
  - { id: req-security, version: "1.0", status: verified, category: security, target: checkout, kind: non-functional, criteria: [requires authenticated customer token] }

evidence:
  - { id: ev-order-test, requirement_id: req-order, requirement_version: "1.0", method: test, passed: true, provenance: tests/checkout/test_checkout.py::test_place_order, subject_revision: "1.0", timestamp: 2026-10-30, verifier: ci }
  - { id: ev-order-contract, requirement_id: req-order-contract, requirement_version: "1.0", method: test, passed: true, provenance: tests/checkout/test_checkout.py::test_orders_api, subject_revision: "1.0", timestamp: 2026-10-30, verifier: ci }
  - { id: ev-order-serial, requirement_id: req-order-serial, requirement_version: "1.0", method: test, passed: true, provenance: tests/checkout/test_checkout.py::test_order_serialization, subject_revision: "1.0", timestamp: 2026-10-30, verifier: ci }
  - { id: ev-resilience, requirement_id: req-resilience, requirement_version: "1.0", method: test, passed: true, provenance: tests/checkout/test_checkout.py::test_inventory_retry, subject_revision: "1.0", timestamp: 2026-10-30, verifier: ci }
  - { id: ev-security, requirement_id: req-security, requirement_version: "1.0", method: inspection, passed: true, provenance: sec::auth_review, subject_revision: "1.0", timestamp: 2026-10-30, verifier: sec-team }
